[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footrack"
version = "0.1.0"
description = "Tactical positioning from football tracking data"
requires-python = ">=3.12"
dependencies = [
    "kloppy>=3.19",
    "mplsoccer>=1.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
